[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "engineering-council"
version = "0.1.0"
description = "Terminal multi-agent council that turns a problem statement into PRD, Technical Approach and Design documents."
requires-python = ">=3.11"
dependencies = [
    "google-genai>=1.0",
    "textual>=0.80",
    "pydantic>=2.6",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "tree-sitter>=0.23",
    "tree-sitter-bash>=0.23",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
engineering-council = "council.cli:main"
coding-harness = "harness.legacy.cli:main"

[tool.setuptools.packages.find]
include = ["meetings*", "harness*", "council_a2a*", "team*", "memory*", "council*"]

[tool.setuptools.package-data]
meetings = ["system_prompts/*.md"]
"harness.legacy" = ["prompts/*.txt"]
harness = ["session/*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
